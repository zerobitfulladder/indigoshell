<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disk usage</title>
<style>
/* ── paste palette.css here ── */

/* Roles: what each palette colour is for in a report. */
:root {
  --page: var(--base-black);
  --plate: var(--popup-bg);
  --edge: var(--base-surface);
  --text: var(--hud-fg-bright);
  --text-dim: var(--hud-fg);
  --muted: var(--base-muted);
  --title: var(--violet-bright);
  --slash: var(--cyan-bright);
  --heading: var(--magenta-bright);
  --value: var(--yellow-bright);
  --code: var(--yellow-bright);
  --code-bar: var(--yellow-dim);
  --code-bg: var(--yellow-faint);
  --link: var(--cyan-bright);
  --good: var(--lime-bright);
  --bad: var(--error);
  --cut: 14px;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; color: var(--text); font: 15px/1.65 var(--font-mono); }
main { max-width: 980px; margin: 48px auto 80px; padding: 0 24px; }
/* The shell's beveled frame: top-right and bottom-left corners cut,
   a 2px border in the frame colour (violet; .cyan for a second kind). */
.plate { --frame: var(--title); background: var(--frame); padding: 2px;
  margin: 22px 0;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut),
    100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }
.plate > div { background: var(--plate); padding: 18px 24px;
  clip-path: inherit; }
.plate.cyan { --frame: var(--slash); }
h1 { font-size: 22px; margin: 0 0 4px; color: var(--title); }
h1::before { content: "// "; color: var(--slash); }
h2 { font-size: 16px; margin: 0 0 10px; color: var(--heading); }
.summary { color: var(--text-dim); margin: 0 0 8px; }
.tag { color: var(--muted); font-size: 12px; letter-spacing: .12em;
  text-transform: uppercase; }
strong { color: var(--text); }
a { color: var(--link); }
code { color: var(--code); background: var(--code-bg); padding: 0 4px; }
pre { margin: 12px 0; padding: 10px 14px; color: var(--code);
  border-left: 2px solid var(--code-bar); white-space: pre-wrap; }
pre code { background: none; padding: 0; }
table { width: 100%; border-collapse: collapse; margin: 6px 0; }
th { text-align: left; color: var(--muted); font-weight: normal;
  font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  padding: 6px 10px; border-bottom: 1px solid var(--edge); }
td { padding: 6px 10px; border-bottom: 1px solid var(--edge); }
th.num { text-align: right; }
td.num { text-align: right; color: var(--value); }
.note { border-left: 2px solid var(--slash); padding: 4px 12px;
  color: var(--text-dim); }
.warn { border-left: 2px solid var(--bad); padding: 4px 12px; }
.good { color: var(--good); }
img { max-width: 100%; display: block; border: 1px solid var(--edge); }
footer { color: var(--muted); font-size: 12px; margin-top: 40px; }
/* Charts: inline <svg>, strokes and fills from the palette's bright
   colours (cyan, violet, magenta, yellow, lime), axis text in --muted. */
</style></head>
<body><main>
  <div class="tag">INDIGO · report</div>
  <h1>Disk usage</h1>
  <p class="summary">Projects is the big one: 21G of 35G in home.</p>

  <div class="plate"><div>
    <h2>Biggest folders</h2>
    <table>
      <tr><th>Folder</th><th class="num">Size</th></tr>
      <tr><td>~/Projects</td><td class="num">21G</td></tr>
      <tr><td>~/.local</td><td class="num">8.9G</td></tr>
    </table>
  </div></div>

  <div class="plate cyan"><div>
    <h2>To free space</h2>
    <pre><code>rm -rf ~/.cache/thumbnails</code></pre>
    <p class="warn">Deletes cached thumbnails only; they regenerate.</p>
  </div></div>

  <footer>INDIGO · 2026-11-18</footer>
</main></body></html>

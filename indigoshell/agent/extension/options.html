<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>INDIGO bridge</title>
  <style>
    body { font: 14px/1.5 monospace; margin: 16px; }
    button { font: inherit; padding: 4px 12px; }
  </style>
</head>
<body>
  <p>INDIGO, the indigoshell call agent, reads and fills pages in this browser
  through this add-on. Running its own JavaScript in a page needs one
  more permission, which only you can give.</p>
  <p id="state"></p>
  <button id="allow" hidden>Allow JavaScript</button>
  <script src="options.js"></script>
</body>
</html>

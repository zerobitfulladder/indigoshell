; Cava config for indigoshell's audio service. Writes raw 16-bit
; unsigned band magnitudes to stdout for in-process consumption — not
; meant to be run by the user directly.
;
; framerate is 30 to match the bar's frame clock. At 60 every second
; frame cava produced was read, unpacked and then thrown away by the
; next one before anything drew it; at 30 the loop wakes half as often
; for an identical picture.

[general]
bars = 20
framerate = 30
autosens = 1
overshoot = 0
sensitivity = 100
lower_cutoff_freq = 30
higher_cutoff_freq = 16000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = binary
bit_format = 16bit
channels = mono

[smoothing]
noise_reduction = 0.77

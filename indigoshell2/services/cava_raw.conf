; Cava config for indigoshell2's audio service. Writes raw 16-bit
; unsigned band magnitudes to stdout for in-process consumption — not
; meant to be run by the user directly.
;
; framerate is 30, not v1's 60. The bar's frame clock runs at 30, so
; every second frame cava produced was read, unpacked and then thrown
; away by the next one before anything drew it. Halving the rate halves
; the loop wakeups for an identical picture.

[general]
bars = 20
framerate = 30
autosens = 1
overshoot = 0
sensitivity = 100
lower_cutoff_freq = 30
higher_cutoff_freq = 16000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = binary
bit_format = 16bit
channels = mono

[smoothing]
noise_reduction = 0.77
